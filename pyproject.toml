[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mara"
version = "0.1.0"
description = "Marketing Agentic Resource Assistant - Multi-agent AI system for campaign planning and analytics"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MARA Team", email = "dev@mara.ai"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "langgraph>=0.0.20",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-analytics-data>=0.18.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["prompts/**/*.txt", "prompts/**/*.py"]
